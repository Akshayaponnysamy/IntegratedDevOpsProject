---
- name: Deploy Integrated DevOps Application
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Display deployment information
      debug:
        msg: "Ansible deployment stage executed successfully."

    - name: Verify Docker socket is available
      stat:
        path: /var/run/docker.sock
      register: docker_socket

    - name: Display Docker socket status
      debug:
        msg: "Docker socket is available: {{ docker_socket.stat.exists }}"
