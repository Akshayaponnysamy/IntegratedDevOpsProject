---
- name: Deploy Integrated DevOps Application
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Stop existing application container
      command: docker rm -f integrated-devops-app
      failed_when: false
      changed_when: true

    - name: Deploy Docker container
      command: docker run -d --name integrated-devops-app -p 8085:80 integrated-devops-app:latest

    - name: Display deployment message
      debug:
        msg: "Integrated DevOps application deployed successfully on port 8085"
